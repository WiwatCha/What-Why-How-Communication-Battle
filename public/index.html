<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>POINT! STORY CHAOS</title><script src="/socket.io/socket.io.js"></script><style>body{margin:0;background:radial-gradient(circle,#34256e,#090815);color:white;font-family:system-ui;text-align:center}.w{max-width:900px;margin:auto;padding:24px}.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:24px;padding:25px;margin:18px}.logo{font-size:52px;font-weight:900;color:#ffe66d}.kw{display:inline-block;padding:14px 20px;margin:8px;border-radius:18px;background:linear-gradient(135deg,#ff9f43,#ffe66d);color:#21182f;font-size:28px;font-weight:900}.kw:nth-child(even){background:linear-gradient(135deg,#00d2d3,#54a0ff);color:white}.timer{font-size:72px;font-weight:900;color:#ffe66d}input,button{padding:13px 17px;border:0;border-radius:13px;margin:5px;font-size:16px}button{background:#6c5ce7;color:white;font-weight:800}.ready{background:#00b894}.hot{background:#ff5e78}.reactbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.reactbar button{font-size:25px;background:#ffffff18}.coverage{margin:14px}.cov{display:inline-block;padding:8px 12px;margin:4px;border-radius:12px;background:#ffffff18}.cov.ok{background:#00b894}.float{position:fixed;left:46%;top:60%;font-size:72px;z-index:99;animation:fly 1.3s forwards}@keyframes fly{to{transform:translateY(-250px) scale(1.8);opacity:0}}.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.p{background:#ffffff12;padding:9px 14px;border-radius:12px}</style></head><body><div class="w"><div class="logo">🎤 POINT! STORY CHAOS</div><p>4 Keywords. แต่งเรื่องให้คนฟังรู้เรื่อง.</p><div id="entry" class="card"><input id="name" placeholder="ชื่อเล่น"><input id="room" placeholder="รหัสห้อง"><button onclick="join()">เข้าห้อง</button><button onclick="create()">สร้างห้อง</button></div><div id="game" style="display:none"><div class="card">ROOM <b id="code"></b><div id="timer" class="timer"></div></div><div id="main"></div><div class="card"><div id="players" class="players"></div></div></div></div><script>const s=io();let st,me,lastReaction=0,recog,heard='';s.on('connect',()=>me=s.id);s.on('state',x=>{st=x;if(x.lastReaction&&x.lastReaction.seq>lastReaction){lastReaction=x.lastReaction.seq;showReaction(x.lastReaction)}render();speechControl()});function nm(){return name.value||'นักเล่าเรื่อง'}function enter(c){entry.style.display='none';game.style.display='block';code.textContent=c||room.value.toUpperCase()}function create(){s.emit('create',{name:nm()},r=>{if(r.ok)enter(r.code)})}function join(){s.emit('join',{name:nm(),code:room.value},r=>{if(r.ok)enter()})}setInterval(()=>{timer.textContent=st&&st.end?Math.max(0,Math.ceil((st.end-Date.now())/1000))+'s':''},200);function kws(){return st.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}function coverage(){return st.keywords.map(k=>`<span class="cov ${(st.usedKeywords||[]).includes(k)?'ok':''}">${(st.usedKeywords||[]).includes(k)?'✅':'⬜'} ${k}</span>`).join('')}function render(){if(!st)return;players.innerHTML=st.players.map(p=>`<div class="p">${p.id===st.speakerId?'🎤 ':''}${p.name}</div>`).join('');let host=st.hostId===me,h='';if(st.phase==='lobby')h=`<div class="card"><h2>กติกา</h2><p>ใช้ Keyword ทั้ง 4 คำ แต่งเป็นเรื่องเดียวกัน จะจริง จะเว่อร์ จะหักมุมก็ได้</p>${host?'<button onclick="s.emit('start')">🎲 สุ่ม Keyword</button>':'รอ Host'}</div>`;if(st.phase==='read')h=`<div class="card"><h2>🎲 KEYWORDS</h2>${kws()}<p>อ่านให้ครบ แล้วเริ่มคิดว่าจะเชื่อมมันเป็นเรื่องอะไร</p>${host?'<button class="ready" onclick="s.emit('skipRead')">ทุกคนพร้อมแล้ว → เริ่มเลย</button>':''}</div>`;if(st.phase==='think')h=`<div class="card"><h2>${st.speakerId===me?'🧠 ถึงตาคุณคิด':'🧠 เพื่อนกำลังคิด'}</h2>${kws()}<p>แต่งเรื่องด้วยสไตล์ของคุณเอง</p>${st.speakerId===me?'<button class="ready" onclick="s.emit('ready')">🔥 READY! เริ่มพูดเลย</button>':''}</div>`;if(st.phase==='speak')h=`<div class="card"><h2>🎤 STORY TIME</h2>${kws()}<div class="coverage">${coverage()}</div><p>${st.speakerId===me?'กำลังตรวจ Keyword จากเสียงพูดอัตโนมัติ':'เชียร์หรือแซวได้แบบ Live'}</p>${st.speakerId!==me?`<div class="reactbar"><button onclick="react('😂')">😂</button><button onclick="react('👏')">👏</button><button onclick="react('🔥')">🔥</button><button onclick="react('🤯')">🤯</button><button onclick="react('rimshot')">🥁</button><button onclick="react('wow')">📢</button><button onclick="react('bruh')">💀</button></div>`:''}${st.speakerId===me||host?'<button class="hot" onclick="s.emit(\'done\')">พูดจบ!</button>':''}</div>`;if(st.phase==='vote')h=`<div class="card"><h2>👏 จบเรื่อง!</h2><p>จำไว้: ประเด็นชัด เหตุผลต่อเนื่อง และจบให้คนฟังรู้ว่าจะเกิดอะไรต่อ</p></div>`;if(st.phase==='results')h=`<div class="card"><h2>🏆 จบรอบ</h2>${host?'<button onclick="s.emit('next')">เล่นรอบใหม่</button>':''}</div>`;main.innerHTML=h}
let ac,cool=false;function tone(f,d=.12,type='sine',v=.05){ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function react(kind){if(cool)return;cool=true;setTimeout(()=>cool=false,1800);s.emit('reaction',{kind})}function showReaction(r){const d=document.createElement('div');d.className='float';d.textContent=r.kind==='rimshot'?'🥁':r.kind==='wow'?'📢 WOW!':r.kind==='bruh'?'💀 BRUH':r.kind;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);if(r.kind==='rimshot'){tone(180,.1,'square');setTimeout(()=>tone(120,.1,'square'),100);setTimeout(()=>tone(700,.3,'triangle'),210)}else if(r.kind==='wow'){tone(440,.15,'sawtooth');setTimeout(()=>tone(880,.3,'sawtooth'),150)}else if(r.kind==='bruh')tone(150,.55,'sawtooth');else tone(620,.12,'triangle')}
function norm(t){return String(t||'').toLowerCase().replace(/\s+/g,'')}function checkWords(t){if(!st||st.speakerId!==me)return;const n=norm(t),used=st.keywords.filter(k=>n.includes(norm(k)));s.emit('coverage',{used})}function speechControl(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(st&&st.phase==='speak'&&st.speakerId===me&&!recog){heard='';recog=new SR();recog.lang='th-TH';recog.continuous=true;recog.interimResults=true;recog.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';heard=t;checkWords(heard)};recog.onend=()=>{if(st&&st.phase==='speak'&&st.speakerId===me){try{recog.start()}catch(e){}}else recog=null};try{recog.start()}catch(e){recog=null}}else if((!st||st.phase!=='speak'||st.speakerId!==me)&&recog){try{recog.stop()}catch(e){}recog=null}}
</script></body></html>
