<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POINT! STORY CHAOS</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#392879,#120d2b 55%,#080611);color:#fff;font-family:Arial,"Noto Sans Thai",sans-serif;text-align:center}.wrap{max-width:1050px;margin:auto;padding:25px}.logo{font-size:clamp(38px,7vw,74px);font-weight:900;color:#ffe66d;text-shadow:0 6px #5e35b1}.card{background:#ffffff12;border:1px solid #ffffff25;border-radius:30px;padding:28px;margin:20px 0;box-shadow:0 25px 70px #0006}.row,.players,.reactbar,.coverage{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}input,button{border:0;border-radius:16px;padding:15px 20px;font-size:18px}input{min-width:260px}button{cursor:pointer;background:#6c5ce7;color:#fff;font-weight:800}button.green{background:#00b894}button.hot{background:#ff5e78}button.bot{background:#e67e22}.error{color:#ff8a9b;font-weight:700}.timer{font-size:68px;font-weight:900;color:#ffe66d}.kw{display:inline-block;margin:8px;padding:14px 20px;border-radius:18px;background:linear-gradient(135deg,#ffe66d,#ff9f43);color:#201630;font-size:28px;font-weight:900}.kw:nth-child(even){background:linear-gradient(135deg,#00d2d3,#54a0ff);color:white}.player{padding:10px 15px;background:#ffffff16;border-radius:14px}.active{outline:3px solid #ffe66d}.cov{padding:9px 13px;border-radius:12px;background:#ffffff17}.cov.ok{background:#00b894}.reactbar button{font-size:26px;background:#ffffff18}.story{text-align:left;max-width:760px;margin:15px auto;line-height:1.7}.story b{color:#ffe66d}.rating input{width:min(420px,90%)}.scoreline{padding:12px;margin:8px;background:#ffffff10;border-radius:12px}.float{position:fixed;left:45%;top:60%;font-size:76px;z-index:10;animation:fly 1.4s forwards;pointer-events:none}@keyframes fly{to{transform:translateY(-280px) scale(1.8) rotate(12deg);opacity:0}}@media(max-width:600px){input{width:100%;min-width:0}.logo{font-size:40px}}
</style></head><body><div class="wrap"><div class="logo">🎤 POINT! STORY CHAOS</div><p>4 Keywords. แต่งเรื่องให้คนฟังรู้เรื่อง.</p><div id="entry" class="card"><div class="row"><input id="nameInput" placeholder="ชื่อเล่น"><input id="roomInput" placeholder="รหัสห้อง"></div><div class="row"><button id="joinBtn">เข้าห้อง</button><button id="createBtn">สร้างห้อง</button><button id="soloBtn" class="bot">เล่นกับ Bot 🤖</button></div><p id="error" class="error"></p></div><div id="game" style="display:none"><div class="card">ROOM <b id="roomCode"></b><div id="timer" class="timer"></div></div><div id="main"></div><div class="card"><h3>ผู้เล่น</h3><div id="players" class="players"></div></div></div></div><script>
const socket=io();let state=null,myId='',lastReaction=0,recognizer=null,heard='',spokenBotKey='';
const $=id=>document.getElementById(id);socket.on('connect',()=>{myId=socket.id;$('error').textContent=''});socket.on('connect_error',()=>{$('error').textContent='เชื่อมต่อ Server ไม่สำเร็จ กรุณาตรวจ Render Log'});
function name(){return $('nameInput').value.trim()||'นักเล่าเรื่อง'}function enter(code){$('entry').style.display='none';$('game').style.display='block';$('roomCode').textContent=code}
$('createBtn').onclick=()=>socket.emit('createRoom',{name:name(),withBot:false},r=>r.ok?enter(r.code):$('error').textContent=r.message);
$('soloBtn').onclick=()=>socket.emit('createRoom',{name:name(),withBot:true},r=>r.ok?enter(r.code):$('error').textContent=r.message);
$('joinBtn').onclick=()=>socket.emit('joinRoom',{name:name(),code:$('roomInput').value},r=>r.ok?enter(r.code):$('error').textContent=r.message);
socket.on('state',s=>{state=s;if(s.lastReaction&&s.lastReaction.seq>lastReaction){lastReaction=s.lastReaction.seq;showReaction(s.lastReaction)}render();controlRecognition();controlBotVoice()});
setInterval(()=>{$('timer').textContent=state&&state.end?Math.max(0,Math.ceil((state.end-Date.now())/1000))+'s':''},200);
function keywords(){return state.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}function coverage(){return state.keywords.map(k=>`<span class="cov ${(state.usedKeywords||[]).includes(k)?'ok':''}">${(state.usedKeywords||[]).includes(k)?'✅':'⬜'} ${k}</span>`).join('')}
function render(){if(!state)return;const host=state.hostId===myId,speaker=state.players.find(p=>p.id===state.speakerId);$('roomCode').textContent=state.code;$('players').innerHTML=state.players.map(p=>`<div class="player ${p.id===state.speakerId?'active':''}">${p.bot?'🤖':'🙂'} ${p.name} <b>⭐ ${p.score||0}</b></div>`).join('');let h='';
if(state.phase==='lobby')h=`<div class="card"><h2>เตรียมเริ่มเกม</h2><p>สุ่ม Keyword 4 คำ แล้วแต่งเรื่องให้เชื่อมกัน</p>${host?'<button class="bot" onclick="socket.emit(\'addBot\')">เพิ่ม Bot 🤖</button> <button class="green" onclick="socket.emit(\'startGame\')">เริ่มเกม 🎲</button>':'รอ Host เริ่มเกม'}</div>`;
if(state.phase==='read')h=`<div class="card"><h2>🎲 KEYWORDS</h2>${keywords()}<p>อ่านและจินตนาการว่าจะเชื่อมทุกคำเป็นเรื่องเดียวกันอย่างไร</p>${host?'<button class="green" onclick="socket.emit(\'readReady\')">ทุกคนพร้อมแล้ว เริ่มคิวแรก</button>':''}</div>`;
if(state.phase==='think')h=`<div class="card"><h2>🧠 ${state.speakerId===myId?'ถึงตาคุณคิด':'กำลังรอ '+speaker.name}</h2>${keywords()}<p>ผู้พูดมีเวลา 30 วินาที</p>${state.speakerId===myId?'<button class="green" onclick="socket.emit(\'speakerReady\')">READY! เริ่มพูด</button>':''}</div>`;
if(state.phase==='speak'||state.phase==='botSpeak'){const bot=state.phase==='botSpeak';h=`<div class="card"><h2>${bot?'🤖 BOT STORY':'🎤 STORY TIME'}</h2>${keywords()}<div class="coverage">${coverage()}</div>${bot&&state.botStory?`<div class="story"><p><b>WHAT:</b> ${state.botStory.what}</p><p><b>WHY:</b> ${state.botStory.why}</p><p><b>HOW:</b> ${state.botStory.how}</p></div>`:''}<p>${state.speakerId===myId?'ระบบกำลังตรวจ Keyword จากไมโครโฟน':bot?'🔊 ระบบจะเลือกเสียงภาษาไทยที่เหมาะสมที่สุดที่มีในอุปกรณ์นี้':'กด Reaction เพื่อเชียร์หรือแซวได้'}</p>${state.speakerId!==myId?reactionButtons():''}${state.speakerId===myId||host?'<button class="hot" onclick="socket.emit(\'finishSpeak\')">พูดจบ / ข้าม Bot</button>':''}</div>`}
if(state.phase==='vote')h=`<div class="card"><h2>⭐ ให้คะแนน ${speaker?speaker.name:''}</h2><p>System Score: ใช้ Keyword ${(state.usedKeywords||[]).length}/${state.keywords.length} คำ (50%)</p>${state.speakerId!==myId?`<p>คะแนนจากคุณ (50% ของคะแนนรวม)</p><div class="rating"><span id="ratingVal">5</span>/10<br><input id="ratingInput" type="range" min="1" max="10" value="5" oninput="document.getElementById('ratingVal').textContent=this.value"><br><button class="green" onclick="sendRating()">ส่งคะแนน</button></div>`:'<p>รอคะแนนจากผู้เล่นคนอื่น...</p>'}</div>`;
if(state.phase==='results'){const rank=[...state.players].sort((a,b)=>(b.score||0)-(a.score||0));h=`<div class="card"><h2>🏆 ผลคะแนน</h2>${rank.map((p,i)=>`<div class="scoreline"><b>${i+1}. ${p.name}</b> — Total ${p.score||0} | Keyword ${p.lastSystem||0}/10 | Peer ${p.lastPeer||0}/10</div>`).join('')}${host?'<button onclick="socket.emit(\'nextRound\')">กลับ Lobby</button>':''}</div>`}$('main').innerHTML=h}
function sendRating(){const e=document.getElementById('ratingInput');if(!e)return;socket.emit('rate',{rating:Number(e.value)});const b=document.querySelector('.rating button');if(b){b.disabled=true;b.textContent='ส่งคะแนนแล้ว ✓'}}function reactionButtons(){return `<div class="reactbar"><button onclick="react('😂')">😂</button><button onclick="react('👏')">👏</button><button onclick="react('🔥')">🔥</button><button onclick="react('🤯')">🤯</button><button onclick="react('rimshot')">🥁</button><button onclick="react('wow')">📢</button><button onclick="react('bruh')">💀</button></div>`}
let audioCtx,cool=false;function tone(f,d=.12,type='sine',v=.04){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function react(kind){if(cool)return;cool=true;setTimeout(()=>cool=false,1800);socket.emit('reaction',{kind})}function showReaction(r){const d=document.createElement('div');d.className='float';d.textContent=r.kind==='rimshot'?'🥁':r.kind==='wow'?'📢 WOW!':r.kind==='bruh'?'💀 BRUH':r.kind;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);if(r.kind==='rimshot'){tone(180,.1,'square');setTimeout(()=>tone(120,.1,'square'),100);setTimeout(()=>tone(700,.3,'triangle'),210)}else if(r.kind==='wow'){tone(440,.15,'sawtooth');setTimeout(()=>tone(880,.3,'sawtooth'),150)}else if(r.kind==='bruh')tone(150,.5,'sawtooth');else tone(620,.12,'triangle')}
function norm(t){return String(t||'').toLowerCase().replace(/\s+/g,'')}function controlRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const should=state&&state.phase==='speak'&&state.speakerId===myId;if(should&&!recognizer){heard='';recognizer=new SR();recognizer.lang='th-TH';recognizer.continuous=true;recognizer.interimResults=true;recognizer.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';heard=t;const n=norm(heard),used=state.keywords.filter(k=>n.includes(norm(k)));socket.emit('coverage',{used})};recognizer.onend=()=>{if(state&&state.phase==='speak'&&state.speakerId===myId){try{recognizer.start()}catch(e){}}else recognizer=null};try{recognizer.start()}catch(e){recognizer=null}}else if(!should&&recognizer){try{recognizer.stop()}catch(e){}recognizer=null}}
function controlBotVoice(){if(!state||state.phase!=='botSpeak'||!state.botStory)return;const key=state.code+'-'+state.round+'-'+state.speakerId+'-'+state.end;if(spokenBotKey===key)return;spokenBotKey=key;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(state.botStory.full);const voices=window.speechSynthesis.getVoices();const th=voices.filter(v=>String(v.lang||'').toLowerCase().startsWith('th'));const preferred=['Premwadee','Niwat','Achara','Kanya','Microsoft Premwadee','Google ไทย','Thai'];let thai=null;for(const n of preferred){thai=th.find(v=>String(v.name).toLowerCase().includes(n.toLowerCase()));if(thai)break}if(!thai)thai=th.find(v=>v.default)||th[0]||voices.find(v=>/thai|ภาษาไทย|ไทย/i.test(v.name));if(thai)u.voice=thai;u.lang=thai&&thai.lang?thai.lang:'th-TH';u.rate=.88;u.pitch=1;u.volume=1;window.speechSynthesis.resume();window.speechSynthesis.speak(u)}
</script></body></html>
