<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POINT! What Why How Battle</title><script src="/socket.io/socket.io.js"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap');
:root{--a:#6c5ce7;--b:#00d2d3;--c:#ff9f43;--d:#ff5e78;--ink:#f7f7ff}*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#493786,#17142d 45%,#090814);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px}.logo{font-size:clamp(38px,8vw,78px);font-weight:800;letter-spacing:-3px;text-shadow:0 5px 0 #ff5e78}.tag{color:#b9b4df}.card{background:#ffffff12;border:1px solid #ffffff25;backdrop-filter:blur(14px);border-radius:24px;padding:24px;margin:18px 0;box-shadow:0 18px 60px #0006}.row{display:flex;gap:12px;flex-wrap:wrap}input,button{font:inherit;border:0;border-radius:14px;padding:14px 18px}input{background:#fff;color:#17142d;min-width:220px;flex:1}button{background:linear-gradient(135deg,var(--a),#9b59ff);color:white;font-weight:800;cursor:pointer;box-shadow:0 8px 24px #6c5ce766}button.alt{background:linear-gradient(135deg,#00b894,var(--b))}button.hot{background:linear-gradient(135deg,#ff7675,var(--d))}button:disabled{opacity:.4}.hidden{display:none}.code{font-size:42px;font-weight:800;color:#ffe66d;letter-spacing:7px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.player{padding:13px;background:#ffffff12;border-radius:15px}.speaker{outline:3px solid #ffe66d;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.025)}}.timer{font-size:56px;font-weight:800;color:#ffe66d}.prompt{font-size:clamp(22px,4vw,36px);font-weight:800;line-height:1.4}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{padding:18px;border-radius:18px;background:#ffffff10}.step b{font-size:24px}.what{border-top:5px solid #54a0ff}.why{border-top:5px solid #ff9f43}.how{border-top:5px solid #1dd1a1}.vote{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vote label{background:#ffffff10;padding:12px;border-radius:12px}.vote input{width:100%}.tip{background:#ffe66d;color:#302b10;padding:12px;border-radius:12px;font-weight:600}.rank{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #ffffff20}@media(max-width:600px){.steps{grid-template-columns:1fr}.vote{grid-template-columns:1fr}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}.botTalk{margin:18px 0;font-size:20px;animation:glow .7s infinite alternate}@keyframes glow{to{box-shadow:0 0 35px #ffe66d;transform:scale(1.01)}}body:before{content:'';position:fixed;inset:-50%;background:conic-gradient(from 0deg,#6c5ce722,#00d2d322,#ff5e7822,#6c5ce722);animation:spin 14s linear infinite;z-index:-2}@keyframes spin{to{transform:rotate(360deg)}}.thinkBig{text-align:center;font-size:clamp(24px,5vw,46px);font-weight:800;color:#ffe66d;margin:25px 0;animation:pulse .8s infinite alternate}.thinking{box-shadow:0 0 45px #00d2d344}.logo{animation:titleBeat 1.2s infinite alternate}@keyframes titleBeat{to{filter:drop-shadow(0 0 20px #00d2d3);transform:translateY(-3px)}}
</style></head><body><div class="wrap"><div class="logo">POINT! 🎤</div><div class="tag">พูดให้รู้เรื่อง ก่อนเพื่อนจะหลับ • WHAT → WHY → HOW</div>
<canvas id="fx"></canvas><div id="entry" class="card"><h2>เข้าร่วมสมรภูมินักพูด</h2><div class="row"><input id="name" placeholder="ชื่อเล่น เช่น พี่หมีสายประชุม"><input id="room" placeholder="รหัสห้อง"><button onclick="join()">เข้าห้อง</button><button class="alt" onclick="create(false)">สร้างห้อง Multiplayer</button><button class="hot" onclick="create(true)">เล่นคนเดียวกับ BOT 🤖</button></div><p id="err"></p></div>
<div id="game" class="hidden"><div class="card"><div>รหัสห้อง</div><div id="code" class="code"></div><div id="phase"></div><div id="timer" class="timer"></div></div><div id="content"></div><div class="card"><h3>ผู้เล่น</h3><div id="players" class="players"></div></div></div></div>
<script>
const s=io();let me=null,st=null,voted=false; s.on('connect',()=>me=s.id); s.on('state',x=>{st=x;voted=false;render()});
function n(){return document.querySelector('#name').value.trim()||'มนุษย์ผู้มีประเด็น'} function create(solo=false){audioStart();s.emit('create',{name:n(),solo},r=>r.ok?enter(r.code):error(r.msg))} function join(){audioStart();s.emit('join',{code:room.value,name:n()},r=>r.ok?enter(r.code):error(r.msg))} function enter(c){entry.classList.add('hidden');game.classList.remove('hidden');code.textContent=c} function error(x){err.textContent=x||'เกิดเหตุการณ์ลึกลับ'}
setInterval(()=>{if(st&&st.timerEnd){let q=Math.max(0,Math.ceil((st.timerEnd-Date.now())/1000));timer.textContent=q+'s'}else timer.textContent=''},250);
function render(){if(!st)return;code.textContent=st.code;const p=st.players.find(x=>x.id===me),host=st.hostId===me,sp=st.players.find(x=>x.id===st.speakerId);players.innerHTML=st.players.sort((a,b)=>b.score-a.score).map(x=>`<div class="player ${x.id===st.speakerId?'speaker':''}"><b>${esc(x.name)}</b><br>⭐ ${x.score}</div>`).join('');phase.textContent=({lobby:'รอสมาชิกแก๊ง',prepare:'อ่านโจทย์ให้เข้าใจก่อน',think:'เวลาคิดส่วนตัว 30 วินาที',speak:'กำลังพูด',vote:'กรรมการกำลังตัดสิน',results:'จบรอบแล้ว'}[st.phase]||'');
let h='';if(st.phase==='lobby'){h=`<div class="card"><h2>กติกาแบบไม่ต้องประชุมชี้แจง 3 รอบ</h2><div class="steps"><div class="step what"><b>WHAT</b><br>เกิดอะไรขึ้น / ต้องการอะไร</div><div class="step why"><b>WHY</b><br>ทำไมต้องสนใจ</div><div class="step how"><b>HOW</b><br>จะทำอะไรต่อ</div></div><p class="tip">ต้องมีอย่างน้อย 2 คน สูงสุด 12 คน • คนพูดมี 60 วินาที • คนอื่นให้คะแนน</p>${host?`<button onclick="s.emit('addBot')">เพิ่ม BOT 🤖</button> <button ${st.players.length<2?'disabled':''} onclick="s.emit('start');boom()">เริ่มความโกลาหล 🚀</button>`:'<p>รอเจ้าห้องกดเริ่ม...</p>'}</div>`}
if(st.phase==='prepare'){h=`<div class="card"><div class="prompt">${esc(st.prompt)}</div><hr><p class="tip">📖 อ่านโจทย์ให้เข้าใจ คุณยังไม่ต้องพูด และไม่ต้องเขียนตามประโยคตัวอย่างใดๆ เมื่อถึงตาคุณจะมีเวลาคิดส่วนตัวอีก 30 วินาที</p>${host?'<button onclick="s.emit(\'readySpeak\')">พร้อมแล้ว เริ่มพูด!</button>':''}</div>`}
if(st.phase==='think'){const mine=st.speakerId===me;h=`<div class="card thinking"><h2>${mine?'🧠 ถึงตาคุณคิดแล้ว':'🧠 '+esc(sp?sp.name:'')+' กำลังคิด'}</h2><div class="prompt">${esc(st.prompt)}</div><p class="tip">${mine?'มีเวลา 30 วินาที เรียบเรียงคำพูดด้วยตัวเองทั้งหมด คิดแค่ว่า จะบอกอะไร → ทำไมคนฟังควรสนใจ → แล้วควรทำอะไรต่อ':'รอเพื่อนเตรียมคำตอบ 30 วินาที'}</p><div class="thinkBig">เตรียมในแบบของคุณเอง</div></div>`}
if(st.phase==='speak'){h=`<div class="card"><h2>${sp&&sp.id===me?'ถึงตาคุณ! อย่าอ้อมโลก 🌍':'ฟัง '+esc(sp?sp.name:'')+' แล้วจับประเด็น'}</h2><div class="prompt">${esc(st.prompt)}</div>${st.botSpeech?`<div class="tip botTalk">🤖 ${esc(st.botSpeech)}</div>`:''}<p class="tip">🎤 พูดด้วยภาษาของคุณเอง ให้คนฟังเข้าใจประเด็น เหตุผล และสิ่งที่ควรทำต่อ</p>${(sp&&sp.id===me)||host?'<button class="hot" onclick="s.emit(\'finishSpeak\')">พูดจบอย่างสง่างาม ✨</button>':''}</div>`}
if(st.phase==='vote'){h=`<div class="card"><h2>${st.speakerId===me?'พักหายใจ คนอื่นกำลังให้คะแนนคุณ':'ให้คะแนน '+esc(sp?sp.name:'')}</h2>${st.speakerId===me?'':`<div class="vote">${slider('what','WHAT ชัดแค่ไหน')}${slider('why','WHY น่าฟังไหม')}${slider('how','HOW ทำตามได้ไหม')}${slider('fun','กระชับและสนุกไหม')}</div><br><button onclick="vote()">ส่งคะแนนแบบไม่ลำเอียง 🤞</button>`}</div>`}
if(st.phase==='results'){let r=[...st.players].sort((a,b)=>b.score-a.score);h=`<div class="card"><h2>🏆 กระดานผู้รอดชีวิตจากการพูดอ้อม</h2>${r.map((x,i)=>`<div class="rank"><b>${i+1}. ${esc(x.name)}</b><span>${x.score} ⭐</span></div>`).join('')}<p class="tip">บทเรียน: บอกประเด็นก่อน เหตุผลตาม แล้วปิดด้วยสิ่งที่จะทำ</p>${host?'<button class="alt" onclick="s.emit(\'nextRound\')">สุ่มโจทย์ประหลาดรอบใหม่ 🎲</button>':''}</div>`}content.innerHTML=h; phaseFX(st.phase)}
function slider(id,label){return `<label>${label}<input id="${id}" type="range" min="1" max="5" value="3"><span> 1–5</span></label>`} function vote(){if(voted)return;voted=true;s.emit('vote',{what:what.value,why:why.value,how:how.value,fun:fun.value});document.querySelector('button[onclick="vote() "]')?.setAttribute('disabled','')} function esc(x){return String(x||'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
// Audio and visual effects: generated in-browser, no copyrighted audio files.
let ac;function tone(f,d=.12,type='sine',v=.04){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function audioStart(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
function boom(){audioStart();[90,130,180,260,360].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.05),i*55));confetti(140)}
let lastPhase='';function phaseFX(p){if(p===lastPhase)return;lastPhase=p;if(p==='think'){tone(330,.18,'triangle',.05);confetti(20)}if(p==='speak'){tone(440,.15,'square',.06);setTimeout(()=>tone(660,.2,'square',.06),150);confetti(60)}if(p==='vote')tone(220,.25,'sawtooth',.04);if(p==='results'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle',.06),i*120));confetti(220)}}
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[];function size(){cv.width=innerWidth;cv.height=innerHeight}onresize=size;size();function confetti(n){for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.28,vx:(Math.random()-.5)*14,vy:-Math.random()*10-3,g:.22,r:Math.random()*6+3,c:['#ffe66d','#ff5e78','#00d2d3','#a29bfe','#fff'][i%5],life:160})}function anim(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;cx.save();cx.translate(p.x,p.y);cx.rotate(p.life*.1);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r,p.r*2,p.r);cx.restore()}requestAnimationFrame(anim)}anim();
</script></body></html>
